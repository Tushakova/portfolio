name: Test event discovery

on:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: "Run 3 additional API queries for target diagnostics"
        type: boolean
        default: false

jobs:
  test-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test filtering
        run: python -m unittest discover -s tests

      - name: Run event discovery
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          RUN_DIAGNOSTICS: ${{ inputs.diagnostics }}
        run: |
          if [ "$RUN_DIAGNOSTICS" = "true" ]; then
            python -u -m src.events.search --diagnostics
          else
            python -u -m src.events.search
          fi
