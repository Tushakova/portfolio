name: Test event ingestion

on:
  workflow_dispatch:

jobs:
  test-ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test standalone event ingestion
        run: python -m src.events.sources.standalone

      - name: Build events dataset
        run: python -m src.events.build

      - name: Show generated dataset
        run: cat data/events.json
